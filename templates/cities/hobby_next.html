
{% extends "theme/base.html" %}

{% block content %}
<main style="
    min-height:75vh;
    display:grid;
    place-items:center;
    padding:40px 20px;
    background:#f1f5fd;
">
    <div style="
        width:100%;
        max-width:560px;
        text-align:center;
        background:white;
        border:1px solid #d9e4f5;
        border-radius:20px;
        padding:48px 32px;
    ">
        <div style="font-size:44px;margin-bottom:16px;">
            📍
        </div>

        <h1 style="font-size:28px;">
            {{ city.name }} Selected!
        </h1>

        <p style="color:#64748b;line-height:1.7;">
            Your destination in {{ city.province }}
            has been saved successfully.
        </p>

        <h2 style="font-size:20px;margin-top:28px;">
            Next: Choose Your Hobbies
        </h2>

        <p style="color:#64748b;">
            The Hobby Selection screen will be
            connected in the next phase.
        </p>

        <a href="{% url 'city_selection' %}"
           style="
               display:inline-block;
               margin-top:20px;
               padding:13px 25px;
               border-radius:10px;
               background:#2864f0;
               color:white;
               text-decoration:none;
               font-weight:700;
           ">
            Change City
        </a>
    </div>
</main>
{% endblock %}
